name: pr test
permissions: {}

on:
  push:
    branches:
      - "renovate/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ (startsWith(github.head_ref, 'renovate/') || startsWith(github.ref, 'refs/heads/renovate/')) && 'renovate' || github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/subconverter

jobs:
  git:
    name: git
    runs-on: ubuntu-slim
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/*/.git/
          key: cached-source-codes-${{ github.run_id }}
          restore-keys: |
            cached-source-codes-
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src/subconverter
          persist-credentials: false
          repository: "tindy2013/subconverter"
          fetch-tags: true
          # ref: "patch-1"
          # fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src/quickjspp
          persist-credentials: false
          repository: "ftk/quickjspp"
          submodules: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src/libcron
          persist-credentials: false
          repository: "PerMalmberg/libcron"
          submodules: true

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: update
        shell: bash
        run: |
            cd ./src/subconverter/ || exit 1
            # git remote remove upstream || true
            # git remote add upstream https://github.com/tindy2013/subconverter.git
            # git fetch --all --prune --prune-tags
            # git pull --rebase upstream master || exit 1

            SHA=$(git describe --exact-match HEAD 2>/dev/null || git describe --tags --always --long)
            [[ -n "$SHA" ]] && sed -i "s/\(v[0-9]\.[0-9]\.[0-9]\)/${SHA}/" src/version.h
            uv run --with gitpython \
                scripts/update_rules.py -c scripts/rules_config.conf

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/*/.git/
          key: cached-source-codes-${{ github.run_id }}
      -
        name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-code
          path: src/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  subconverter:
    name: subconverter
    needs:
      - git
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-code
          path: src/
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      -
        name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-contexts: |
            src_quickjspp=./src/quickjspp/
            src_libcron=./src/libcron/
            src_subconverter=./src/subconverter/
          context: "{{defaultContext}}:docker"
          load: true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          tags: ${{ env.REGISTRY_IMAGE }}:pr-test
